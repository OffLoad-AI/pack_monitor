[alembic]
script_location = alembic
prepend_sys_path = .
# Without this Alembic falls back to splitting paths on spaces and commas, which
# breaks on any checkout whose path contains a space — this one does.
path_separator = os
# The URL is resolved in env.py from PCM_DB_PATH so the CLI, the API and the tests
# all migrate whichever database they are actually pointed at.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# WARN, not INFO: init_db() stamps or upgrades on every start-up, and at INFO that
# chatters into the output of every CLI command and test run. Migrations that
# actually change something still report through the CLI's own output.
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
